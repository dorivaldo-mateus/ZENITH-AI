<script src="https://cdn.jsdelivr.net/particles.js/2.0.0/particles.min.js"></script>
<script type="module">

  const frase = "Aprenda qualquer disciplina com explicações claras e personalizadas com a ZENITH";
  const elemento = document.getElementById("texto");
let i = 0;

function digitar() {
    if (i < frase.length) {
        elemento.textContent += frase.charAt(i);
        i++;
        setTimeout(digitar, 40);
    }
}
digitar();


  
  particlesJS("particles-js", {
  particles: {
    number: {
      value: 400
    },

    color: {
      value: "#5c82ff"
    },

    shape: {
      type: "circle"
    },

    opacity: {
      value: 0.4
    },

    size: {
      value: 2
    },

    move: {
      enable: true,
      speed: 1        
    },
    line_linked: {
      enable: true,
      distance: 150,
      color: "#700e88",
      opacity: 0.2,
      width: 1
    }
  },

  interactivity: {
    events: {
      onhover: {
        enable: true,
        mode: "grab"
      }
    }
  }
 });
</script>
</html>
